# 백엔드 루트의 .env 파일을 Properties 형식으로 읽기
spring.config.import=optional:file:./.env[.properties]

server.port=8080
# 1. 애플리케이션 이름
spring.application.name=erp-backend

# 2. SQLite 연결 정보
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=${DB_URL}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-sqlite.sql

# 3. JPA & Hibernate 설정
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# ddl-auto: 엔티티(Entity) 기반으로 테이블을 자동 생성/수정 (운영 환경에서는 none 또는 validate 권장)
spring.jpa.hibernate.ddl-auto=none

# 콘솔에 실행되는 SQL문 출력
spring.jpa.show-sql=true

# 출력되는 SQL문을 보기 좋게 정렬
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-time=3600000

# 구글 SMTP 메일 설정 (본인의 구글 계정과 앱 비밀번호로 변경해야 합니다)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 프론트 주소
app.frontend-url=${APP_FRONTEND_URL}

# 첫 관리자: 관리자가 한 명도 없을 때 서버 시작 시 이 이메일의 회원을 관리자로 지정
# 실행 예: INITIAL_ADMIN_EMAIL=admin@erp.com ./gradlew bootRun (비워 두면 아무것도 하지 않음)
app.initial-admin-email=${INITIAL_ADMIN_EMAIL:}

# 구글 로그인, 회원가입
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI}

# 카카오 로그인, 회원가입
kakao.client-id=${KAKAO_REST_API_KEY}
kakao.client-secret=${KAKAO_CLIENT_SECRET}
kakao.redirect-uri=${KAKAO_REDIRECT_URI}

logging.level.root: INFO
logging.level.com.example.demo: DEBUG
logging.level.org.springframework.security: DEBUG
